services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: finstat
      POSTGRES_PASSWORD: finstat
      POSTGRES_DB: finstat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql

volumes:
  pgdata: